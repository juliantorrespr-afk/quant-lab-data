name: quant-lab-daily
on:
  schedule:
    - cron: "10 0 * * *"   # 00:10 UTC daily: after Kraken's daily candle closes and the US session is done
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed-and-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 1. fetch closes (Kraken + Yahoo)
        run: python fetch.py
      - name: 2. run the bot (DRY = paper ledger; ALPACA = paper broker)
        env:
          MODE: ${{ vars.MODE || 'DRY' }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python bot.py
      - name: 3. commit ledger + signals
        run: |
          git config user.name "quant-lab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "desk: $(date -u +%F)"
          git push
