name: pulse
# DISPLAY ONLY - refreshes quotes, scorecard and the dashboard every hour.
# It never runs bot.py and never places an order.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pulse
  cancel-in-progress: false
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install tradingview-ta
      - run: python pulse.py
      - name: commit
        run: |
          git config user.name "quantlab-pulse"
          git config user.email "pulse@users.noreply.github.com"
          git add -A docs data || true
          git diff --staged --quiet || git commit -m "pulse $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
